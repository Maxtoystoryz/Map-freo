<!DOCTYPE html>
<html>
<head>
  <title>TAFE Map with Password + Live Tracking + Selector + Confetti</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />

  <style>
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.5); opacity: 0.6; }
      100% { transform: scale(1); opacity: 1; }
    }
    .pulse-circle {
      width: 30px; height: 30px; border-radius: 50%;
      background: rgba(255, 0, 0, 0.6);
      border: 3px solid red;
      animation: pulse 3s infinite;
      box-shadow: 0 0 8px 3px rgba(255,0,0,0.7);
      pointer-events: none; user-select: none;
    }

    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; display: none; }
    .label-icon {
      background-color: #0078ff; color: white; padding: 2px 6px;
      border-radius: 4px; font-size: 12px; font-weight: bold;
      border: 1px solid #fff; box-shadow: 0 0 3px rgba(0,0,0,0.5);
      white-space: nowrap;
    }
    .live-location-marker {
      background: rgba(255, 0, 0, 0.8);
      border-radius: 50%; width: 16px; height: 16px;
      border: 2px solid white;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    }

    #passwordOverlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex; justify-content: center; align-items: center;
      z-index: 9999; flex-direction: column; color: white;
      font-family: Arial, sans-serif;
    }
    #passwordOverlay input[type="password"] {
      padding: 10px; font-size: 16px;
      border-radius: 5px; border: none;
      margin-top: 10px; width: 200px; text-align: center;
    }
    #passwordOverlay button {
      margin-top: 15px; padding: 10px 20px;
      font-size: 16px; border-radius: 5px;
      border: none; background-color: #0078ff; color: white;
      cursor: pointer;
    }
    #passwordError {
      margin-top: 10px; color: #ff6666; height: 18px;
    }
    #buildingSelect {
      width: 220px; margin: 10px auto;
      font-size: 16px; padding: 5px;
      border-radius: 5px; border: 1px solid #ccc;
      text-align-last: center; display: none;
      font-family: Arial, sans-serif;
    }

    /* Confetti container */
    #confettiContainer {
      pointer-events: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 10000;
      overflow: visible;
      display: none;
    }
    .confetti {
      position: absolute;
      font-size: 24px;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: 1;
      opacity: 0.9;
      user-select: none;
    }
    @keyframes fall {
      0% { transform: translateY(-30px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div id="passwordOverlay">
    <div>Please enter password to access the map:</div>
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="passwordBtn">Submit</button>
    <div id="passwordError"></div>
  </div>

  <select id="buildingSelect">
    <option value="">Select a building</option>
  </select>

  <div id="map"></div>
  <div id="confettiContainer"></div>

  <script>
    const correctPassword = "lesgo2025";

    const passwordOverlay = document.getElementById('passwordOverlay');
    const passwordInput = document.getElementById('passwordInput');
    const passwordBtn = document.getElementById('passwordBtn');
    const passwordError = document.getElementById('passwordError');
    const mapDiv = document.getElementById('map');
    const buildingSelect = document.getElementById('buildingSelect');
    const confettiContainer = document.getElementById('confettiContainer');

    passwordBtn.addEventListener('click', () => {
      const entered = passwordInput.value;
      if (entered === correctPassword) {
        launchConfetti();
        setTimeout(() => {
          confettiContainer.style.display = 'none';
          passwordOverlay.style.display = 'none';
          mapDiv.style.display = 'block';
          buildingSelect.style.display = 'block';
          initializeMap();
        }, 3000); // Show confetti for 3 seconds before showing map
      } else {
        passwordError.textContent = "Incorrect password, please try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    passwordInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') passwordBtn.click();
    });

    function launchConfetti() {
      confettiContainer.style.display = 'block';
      for(let i = 0; i < 150; i++) {
        const confetti = document.createElement('div');
        confetti.classList.add('confetti');
        confetti.style.left = Math.random() * 100 + 'vw';
        confetti.style.animationDuration = (Math.random() * 3 + 2) + 's';
        confetti.style.fontSize = (Math.random() * 20 + 10) + 'px';

        // Choose a confetti emoji randomly
        const confettiEmojis = ['🎉', '✨', '🎊', '🥳', '🎈', '💥'];
        confetti.textContent = confettiEmojis[Math.floor(Math.random() * confettiEmojis.length)];

        confettiContainer.appendChild(confetti);

        // Remove confetti after animation finishes
        confetti.addEventListener('animationend', () => {
          confetti.remove();
        });
      }
    }

    function initializeMap() {
      const map = L.map('map').setView([-32.055, 115.7435], 17);
      map.options.minZoom = 17;
      map.options.maxZoom = 22;

      L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles © Esri, DigitalGlobe, Earthstar Geographics',
    maxZoom: 22,
    detectRetina: true
  }
).addTo(map);



         const buildings = [
      { name: "ND48", coords: [-32.05406995747874, 115.7443606545727] },
      { name: "ND49", coords: [-32.054025, 115.743894] },
      { name: "ND50", coords: [-32.054300, 115.743997] },
      { name: "Entry", coords: [-32.053928, 115.743659] },
      { name: "ND46 ⚕️", coords: [-32.054379, 115.743572] },
      { name: "ND40 ⚕️", coords: [-32.05443275527898, 115.74337488031232] },
      { name: "ND37 ⚕️", coords: [-32.054977444754684, 115.74276781198407] }, // updated coords
      { name: "ND43 101 ⚕️", coords: [-32.054991, 115.743039] },
      { name: "ND36 Gate ⛿", coords: [-32.05436342389399, 115.74326557690927] },
      { name: "ND36 ⚖️", coords: [-32.054665771306304, 115.74309391553228] },
      { name: "ND42", coords: [-32.05546818031207, 115.74249060336143] },
      { name: "ND32", coords: [-32.05562471813233, 115.74225350353332] },
      { name: "ND33", coords: [-32.05584260141241, 115.74262620385835] },
      { name: "ND19", coords: [-32.05543656663422, 115.74289369651001] },
      { name: "ND31", coords: [-32.055333, 115.743174] },
      { name: "Enzo’s ✂️", coords: [-32.055388569075326, 115.74314783581423] },
      { name: "ND28 Gate ⛿", coords: [-32.05511066174629, 115.74320013889003] },
      { name: "ND28", coords: [-32.05527092742327, 115.74335101314716] },
      { name: "ND23 Gate ⛿", coords: [-32.055786, 115.743283] },
      { name: "ND23", coords: [-32.055651653392324, 115.74321971166759] },
      { name: "ND1", coords: [-32.056016394932236, 115.74330731440126] },
      { name: "ND2", coords: [-32.056298, 115.743458] },
      { name: "ND3", coords: [-32.05652262687087, 115.74355544412231] },
      { name: "ND4", coords: [-32.056684951906085, 115.74304759933608] },
      { name: "ND6", coords: [-32.05584230974208, 115.74362360792577] },
      { name: "ND24", coords: [-32.05680316004233, 115.74358806445255] },
      { name: "ND25", coords: [-32.056918257011624, 115.74362756870676] },
      { name: "ND22", coords: [-32.057130803688196, 115.7437469270079] },
      { name: "Chapel ✝️", coords: [-32.0566177221772, 115.74393254866074] },
      { name: "UP1 🅿️", coords: [-32.05689722964096, 115.7440238650887] },
      { name: "UP2 🅿️", coords: [-32.057007, 115.743194] },
      { name: "UP3 🅿️", coords: [-32.056646, 115.743212] },
      { name: "UP4 🅿️", coords: [-32.055933, 115.742335] },
      { name: "UP5 🅿️", coords: [-32.055860, 115.743190] },
      { name: "UP7 🅿️", coords: [-32.054592, 115.743619] },

      // Additional buildings you added:
      { name: "Batman Courtyard", coords: [-32.056481, 115.744092] },
      { name: "ND9", coords: [-32.056688459509985, 115.74418314143297] },
      { name: "ND10 Bathrooms", coords: [-32.0565021398294, 115.74423381384271] },
      { name: "ND11", coords: [-32.056571, 115.744268] },
      { name: "ND13", coords: [-32.05659135041864, 115.74442519596545] },
      { name: "ND7", coords: [-32.0563039323053, 115.74381046334626] },
      { name: "ND17", coords: [-32.056171827789534, 115.74423799508918] },
      { name: "ND16", coords: [-32.05633507438695, 115.74427751676245] }, // converted from DMS
      { name: "ND39", coords: [-32.05631006870412, 115.74446661249807] },
      { name: "ND14", coords: [-32.05663983457753, 115.74462121895584] },
      { name: "ND34", coords: [-32.056457415816624, 115.74454091059914] },
      { name: "ND12", coords: [-32.05690841781582, 115.74447974560812] },
      { name: "ND35", coords: [-32.05608981784427, 115.74466741507653] },
      { name: "ND38", coords: [-32.05590927639184, 115.74432587242015] },
      { name: "ND21", coords: [-32.05581759497825, 115.74417455365061] },
      { name: "ND18", coords: [-32.05567408646864, 115.74419924199545] }
    ];

      // Sort buildings by number in name
      buildings.sort((a, b) => {
        const numA = parseInt(a.name.match(/\d+/)?.[0] || 0, 10);
        const numB = parseInt(b.name.match(/\d+/)?.[0] || 0, 10);
        return numA - numB;
      });
      // Populate dropdown
      buildings.forEach(building => {
        const option = document.createElement('option');
        option.value = JSON.stringify(building.coords);
        option.textContent = building.name;
        buildingSelect.appendChild(option);
      });

      // Add building markers with labels and popup
      buildings.forEach(building => {
        const streetViewUrl = `https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${building.coords[0]},${building.coords[1]}`;
        const labelIcon = L.divIcon({
          className: 'label-icon',
          html: building.name,
          iconSize: [60, 20],
          iconAnchor: [30, 10]
        });
        L.marker(building.coords, { icon: labelIcon })
          .addTo(map)
          .bindPopup(`<strong>${building.name}</strong><br><a href="${streetViewUrl}" target="_blank" rel="noopener noreferrer">📷 View Street View</a>`);
      });

      const pulseIcon = L.divIcon({
        className: '',
        html: '<div class="pulse-circle"></div>',
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      let pulseMarker = null;

      buildingSelect.addEventListener('change', () => {
        const value = buildingSelect.value;
        if (!value) return;
        const coords = JSON.parse(value);
        map.setView(coords, 18);

        if (pulseMarker) {
          map.removeLayer(pulseMarker);
        }
        pulseMarker = L.marker(coords, { icon: pulseIcon }).addTo(map);
        setTimeout(() => {
          if (pulseMarker) {
            map.removeLayer(pulseMarker);
            pulseMarker = null;
          }
        }, 3000);
      });

      // Live location marker setup
      let liveMarker = null;
      const liveLocationIcon = L.divIcon({
        className: 'live-location-marker'
      });

      function onLocationFound(e) {
        const latlng = e.latlng;
        if (!liveMarker) {
          liveMarker = L.marker(latlng, { icon: liveLocationIcon }).addTo(map);
        } else {
          liveMarker.setLatLng(latlng);
        }
      }

      function onLocationError(e) {
        console.log("Location error: " + e.message);
      }

      map.locate({ watch: true, setView: false, enableHighAccuracy: true });
      map.on('locationfound', onLocationFound);
      map.on('locationerror', onLocationError);

      // Routing machine setup using OSRM demo server
      let routingControl = null;

      buildingSelect.addEventListener('change', () => {
        if (routingControl) {
          routingControl.remove();
          routingControl = null;
        }
        const value = buildingSelect.value;
        if (!value) return;

        if (!liveMarker) return;

        const start = liveMarker.getLatLng();
        const endCoords = JSON.parse(value);
        const end = L.latLng(endCoords[0], endCoords[1]);

        routingControl = L.Routing.control({
          waypoints: [start, end],
          router: L.Routing.osrmv1({
            profile: 'foot',
            // use the OSRM demo server; in prod use your own or a different backend for cutting through buildings
          }),
          lineOptions: {
            styles: [{color: 'blue', opacity: 0.6, weight: 6}]
          },
          createMarker: function() { return null; },
          addWaypoints: false,
          routeWhileDragging: false,
          fitSelectedRoutes: true,
          showAlternatives: false,
          collapsible: true,
          autoRoute: true,
          show: false,
          useZoomParameter: true
        }).addTo(map);
      });
    }
  </script>
</body>
</html>
