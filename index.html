<!DOCTYPE html>
<html>
<head>
  <title>TAFE Map with Dropdown</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    #map { height: 100vh; display: none; }

    /* Dropdown styles */
    #buildingSelect {
      width: 220px;
      margin: 10px auto;
      font-size: 16px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      text-align-last: center;
      display: none; /* hidden by default */
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div id="passwordOverlay">
    <div>Please enter password to access the map:</div>
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="passwordBtn">Submit</button>
    <div id="passwordError"></div>
  </div>

  <select id="buildingSelect">
    <option value="">Select a building</option>
  </select>

  <div id="map"></div>

  <script>
    const correctPassword = "lesgo2025";

    const passwordOverlay = document.getElementById('passwordOverlay');
    const passwordInput = document.getElementById('passwordInput');
    const passwordBtn = document.getElementById('passwordBtn');
    const passwordError = document.getElementById('passwordError');
    const mapDiv = document.getElementById('map');
    const buildingSelect = document.getElementById('buildingSelect');

    passwordBtn.addEventListener('click', () => {
      const entered = passwordInput.value;
      if (entered === correctPassword) {
        passwordOverlay.style.display = 'none';
        mapDiv.style.display = 'block';
        buildingSelect.style.display = 'block';
        initializeMap();
      } else {
        passwordError.textContent = "Incorrect password, please try again.";
        passwordInput.value = "";
        passwordInput.focus();
      }
    });

    function initializeMap() {
      const map = L.map('map').setView([-32.055, 115.7435], 17);
      map.options.minZoom = 16;
      map.options.maxZoom = 22;

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: 'Map data © OpenStreetMap contributors'
      }).addTo(map);

      const buildings = [
        { name: "ND48", coords: [-32.054211, 115.744601] },
        { name: "ND49", coords: [-32.054025, 115.743894] },
        { name: "ND50", coords: [-32.054300, 115.743997] },
        { name: "ND46", coords: [-32.054379, 115.743572] }
        // Add more as needed
      ];

      buildings.forEach((building, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = building.name;
        buildingSelect.appendChild(option);

        const labelIcon = L.divIcon({
          className: 'label-icon',
          html: building.name,
          iconSize: [60, 20],
          iconAnchor: [30, 10]
        });

        L.marker(building.coords, { icon: labelIcon })
          .addTo(map)
          .bindPopup(`<strong>${building.name}</strong>`);
      });

      buildingSelect.addEventListener('change', function () {
        const selectedIndex = this.value;
        if (selectedIndex !== "") {
          const selectedBuilding = buildings[selectedIndex];
          map.setView(selectedBuilding.coords, 20);
        }
      });

      map.locate({ watch: true, setView: false, maxZoom: 18 });

      map.on('locationfound', (e) => {
        const marker = L.marker(e.latlng).addTo(map);
        marker.bindPopup("You are here").openPopup();
      });

      map.on('locationerror', () => {
        alert("Could not get your location.");
      });
    }
  </script>

</body>
</html>
