<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Map with Buildings and Dropdown</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }
    #map {
      height: 100vh;
      display: none;
    }
    #buildingSelect {
      width: 240px;
      margin: 10px auto;
      font-size: 16px;
      padding: 5px;
      border-radius: 5px;
      border: 1px solid #ccc;
      display: block;
      text-align-last: center;
    }
    .label-icon {
      background-color: #0078ff;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
      border: 1px solid #fff;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
      white-space: nowrap;
    }
    .live-location-marker {
      background: rgba(255, 0, 0, 0.8);
      border-radius: 50%;
      width: 16px;
      height: 16px;
      border: 2px solid white;
      box-shadow: 0 0 8px rgba(255, 0, 0, 0.8);
    }
    #passwordOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      flex-direction: column;
      color: white;
      font-family: Arial, sans-serif;
    }
    #passwordOverlay input[type="password"] {
      padding: 10px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      margin-top: 10px;
      width: 200px;
      text-align: center;
    }
    #passwordOverlay button {
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      background-color: #0078ff;
      color: white;
      cursor: pointer;
    }
    #passwordError {
      margin-top: 10px;
      color: #ff6666;
      height: 18px;
    }
  </style>
</head>
<body>
  <div id="passwordOverlay">
    <div>Please enter password to access the map:</div>
    <input type="password" id="passwordInput" placeholder="Password" />
    <button id="passwordBtn">Submit</button>
    <div id="passwordError"></div>
  </div>

  <select id="buildingSelect" style="display:none;">
    <option value="">Select a building</option>
  </select>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

</body>
</html>
